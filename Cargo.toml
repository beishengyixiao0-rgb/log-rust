[package]
name = "bitlog"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
parking_lot = "0.12"
once_cell = "1.19"

colored = "2"
flate2 = "1"

tokio = { version = "1", features = ["full"] }

axum = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
mysql = "25"
toml = "0.8"

ratatui = "0.26"
crossterm = "0.27"


[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "async_demo"
path = "examples/async_demo.rs"

[[example]]
name = "file_sink"
path = "examples/file_sink.rs"

[[example]]
name = "dashboard_demo"
path = "examples/dashboard_demo.rs"

[[example]]
name = "mysql_demo"
path = "examples/mysql_demo.rs"
